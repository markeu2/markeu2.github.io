<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Premium Promo</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(135deg, #1a0000 0%, #0d0d0d 100%);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.2);
            border-radius: 15px;
        }

        /* 상단 헤더 영역 */
        .header {
            text-align: center;
            position: relative;
            margin-bottom: 25px;
            width: 100%;
        }

        .crown {
            font-size: 36px;
            display: block;
            margin-bottom: -10px;
            filter: drop-shadow(0 2px 5px rgba(255, 215, 0, 0.6));
        }

        .title-box h1 {
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -1px;
        }

        .title-box .youtube-text {
            color: #ff0000;
        }

        .title-box .premium-text {
            color: #ffffff;
        }

        /* 광고 차단 배지 */
        .no-ads-badge {
            position: absolute;
            top: 5px;
            right: 10px;
            background-color: #ff0000;
            color: white;
            border: 3px solid #ffffff;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 11px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            transform: rotate(15deg);
        }

        .no-ads-badge span {
            font-size: 14px;
            color: yellow;
            text-decoration: line-through;
        }

        /* 본문 카드 박스 */
        .content-card {
            background-color: rgba(20, 0, 0, 0.85);
            border: 2px solid #ff3333;
            border-radius: 12px;
            padding: 25px 20px;
            width: 100%;
            box-shadow: inset 0 0 15px rgba(255, 0, 0, 0.2);
            margin-bottom: 25px;
        }

        .best-service {
            background-color: #ffffff;
            color: #000000;
            font-weight: 900;
            font-size: 14px;
            padding: 6px 15px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .feature-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            font-size: 15px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.08);
            padding: 10px 15px;
            border-radius: 8px;
        }

        .check-icon {
            color: #00ff66;
            font-size: 18px;
            margin-right: 12px;
            background: rgba(0, 255, 102, 0.15);
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 주문 버튼 */
        .order-btn {
            background-color: #ffffff;
            color: #ff0000;
            font-size: 20px;
            font-weight: 900;
            padding: 14px;
            width: 100%;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .order-btn:hover {
            background-color: #f0f0f0;
            transform: translateY(-2px);
        }

        /* 연락처 영역 */
        .contact-footer {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .whatsapp-icon {
            background-color: #25D366;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 상단 헤더 및 왕관, 광고 배지 -->
        <div class="header">
            <div class="crown">👑</div>
            <div class="title-box">
                <h1><span class="youtube-text">YouTube</span> <span class="premium-text">Premium</span></h1>
            </div>
            <div class="no-ads-badge">
                <span>ADS</span>
                NO
            </div>
        </div>

        <!-- 기능 소개 카드 박스 -->
        <div class="content-card">
            <div class="best-service">BEST SERVICE</div>
            <ul class="feature-list">
                <li class="feature-item">
                    <span class="check-icon">✔</span> NO ADS
                </li>
                <li class="feature-item">
                    <span class="check-icon">✔</span> FULL HD QUALITY VIDEOS
                </li>
                <li class="feature-item">
                    <span class="check-icon">✔</span> BACKGROUND PLAY
                </li>
                <li class="feature-item">
                    <span class="check-icon">✔</span> YOUTUBE MUSIC
                </li>
            </ul>
        </div>

        <!-- 주문 버튼 -->
        <button class="order-btn">ORDER NOW!</button>

        <!-- 연락처 -->
        <div class="contact-footer">
            <div class="whatsapp-icon">📞</div>
            <span>+8801811447737</span>
        </div>
    </div>

</body>
</html>
